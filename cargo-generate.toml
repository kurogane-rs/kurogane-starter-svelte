[placeholders.language]
type = "string"
prompt = "Language"
default = "typescript"
choices = ["typescript", "javascript"]

[conditional.'language == "typescript"']
ignore = ["frontend/src/main.js"]

[conditional.'language == "javascript"']
ignore = ["frontend/src/main.ts", "frontend/src/svelte-shim.d.ts", "frontend/src/vite-env.d.ts", "frontend/tsconfig.json"]
